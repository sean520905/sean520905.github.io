<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>话术 · LITTLE UNIVERSE</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #e8e8e6;
  position: relative;
  overflow-x: hidden;
  background-color: #14161f;

  background-image: linear-gradient(135deg, rgba(12, 14, 26, 0.46), rgba(30, 32, 52, 0.38)),
    url("images/bg.jpg");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
}

.page {
  position: relative;
  z-index: 1;
  max-width: 640px;
  margin: 40px auto;
  padding: 0 20px;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 16px;
  font-size: 13.5px;
  color: #c2c2c0;
  text-decoration: none;
  background: rgba(255, 255, 255, 0.10);
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: 14px;
  backdrop-filter: blur(22px) saturate(1.6);
  -webkit-backdrop-filter: blur(22px) saturate(1.6);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.30);
  transition: all 0.24s ease;
}

.back-btn::before {
  content: "‹";
  font-size: 17px;
  line-height: 1;
}

.back-btn:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.26);
  transform: translateX(-2px);
}

.content-card {
  margin-top: 20px;
  background: rgba(255, 255, 255, 0.10);
  backdrop-filter: blur(24px) saturate(1.7);
  -webkit-backdrop-filter: blur(24px) saturate(1.7);
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 28px;
  padding: 28px 26px;
  box-shadow:
    0 12px 44px rgba(0, 0, 0, 0.24),
    inset 0 1px 0 rgba(255, 255, 255, 0.45),
    inset 0 -1px 0 rgba(255, 255, 255, 0.08);
}

.page-title {
  font-size: 26px;
  letter-spacing: 3px;
  color: #ffffff;
  text-shadow: 0 0 14px rgba(255, 255, 255, 0.35);
}

.page-sub {
  font-size: 13px;
  color: #a6a6a4;
  letter-spacing: 1px;
  margin-top: 6px;
  margin-bottom: 20px;
  padding-bottom: 18px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.page-body {
  font-size: 14.5px;
  line-height: 1.9;
  color: #e0e0de;
}

.page-body p {
  margin: 12px 0;
}

.page-body .placeholder {
  color: #9a9a98;
  font-style: italic;
}

.footer-text {
  margin-top: 26px;
  font-size: 12.5px;
  color: #a8a8a6;
  text-align: center;
}

@media (max-width: 768px) {
  .page {
    margin: 24px auto;
  }

  .content-card {
    padding: 22px 20px;
  }
}
</style>
</head>

<body>

<div class="page">
  <a class="back-btn" href="index.html">返回主页</a>

  <div class="content-card">
    <h1 class="page-title">话术</h1>
    <p class="page-sub">SCRIPT · WORDS</p>

    <div class="page-body">
      <p class="placeholder">这里是「话术」的内容区域，等待填写。</p>
      <p>可以在这里整理常用的话术、回复模板、表达技巧之类的内容。</p>
    </div>
  </div>

  <p class="footer-text">Welcome to my little universe</p>
</div>

</body>
</html>

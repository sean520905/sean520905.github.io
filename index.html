<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LITTLE UNIVERSE</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #f0f0f8;
  position: relative;
  overflow-x: hidden;

  background-image: url("https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1600&q=80");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, rgba(10, 12, 24, 0.55), rgba(28, 29, 49, 0.45));
  z-index: 0;
  pointer-events: none;
}

@keyframes pageSlideIn {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* 实时时间 */
.realtime {
  font-size: 13px;
  color: #a9adcc;
  letter-spacing: 1px;
  margin-bottom: 8px;
  text-shadow: 0 0 6px rgba(200, 210, 240, 0.25);
}

/* ✨ 主信息卡：收紧了，变短！ */
.profile-card {
  position: relative;
  z-index: 1;
  margin: 40px 0 0 40px;
  max-width: 420px;
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 22px;
  padding: 22px 22px 20px; /* 上下内边距缩小，卡片变矮 */
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  animation: pageSlideIn 1.2s ease-out;
}

/* 圆形头像 */
.avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255, 255, 255, 0.25);
  box-shadow: 0 0 18px rgba(255, 255, 255, 0.18);
  position: absolute;
  top: -32px;
  left: 22px;
  z-index: 2;
  background: rgba(255, 255, 255, 0.08);
}

/* 卡片扫光 */
.profile-card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 22px;
  overflow: hidden;
  pointer-events: none;
  background: linear-gradient(
    110deg,
    transparent 30%,
    rgba(255, 255, 255, 0.08) 50%,
    transparent 70%
  );
  transform: translateX(-120%);
  animation: sweep 7s ease-in-out infinite;
}

@keyframes sweep {
  0% {
    transform: translateX(-120%);
  }
  50% {
    transform: translateX(120%);
  }
  100% {
    transform: translateX(120%);
  }
}

.name {
  font-size: 24px;
  letter-spacing: 2px;
  text-shadow: 0 0 10px rgba(210, 220, 255, 0.35);
  margin: 14px 0 3px; /* 缩减间距 */
}

.subtitle {
  font-size: 14px;
  color: #c5c8e0;
  margin-bottom: 14px; /* 缩减间距 */
}

.info-line {
  font-size: 15px;
  color: #e4e6f4;
  margin: 7px 0; /* ✅ 行间距缩小！！之前是10px */
  overflow: hidden;
  white-space: nowrap;
  width: fit-content;
  border-right: 2px solid rgba(220, 225, 255, 0.4);
}

.line-1 {
  animation: type 1.8s steps(22) 0.5s forwards, blink 0.7s infinite;
  width: 0;
}

.line-2 {
  animation: type 1.6s steps(18) 2.4s forwards, blink 0.7s infinite;
  width: 0;
}

.alias-line {
  animation: type 1.2s steps(8) 4.2s forwards, blink 0.7s infinite;
  width: 0;
}

@keyframes type {
  to {
    width: 100%;
  }
}

@keyframes blink {
  0%, 100% {
    border-color: rgba(220, 225, 255, 0.4);
  }
  50% {
    border-color: transparent;
  }
}

.tag-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0; /* 标签区域上下间距缩小 */
  opacity: 0;
  animation: fadeTag 1s ease-out 5.5s forwards;
}

@keyframes fadeTag {
  to {
    opacity: 1;
  }
}

.tag {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 999px;
  padding: 4px 11px;
  font-size: 13px;
  color: #d8d9ec;
}

/* 下方小卡片 */
.small-card {
  position: relative;
  z-index: 1;
  margin: 22px 0 0 40px;
  max-width: 420px;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 18px;
  padding: 18px 22px;
  opacity: 0;
  transform: translateY(12px);
  animation: slideSmallCard 1s ease-out 6.5s forwards;
}

@keyframes slideSmallCard {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.small-item {
  font-size: 15px;
  color: #c8cadf;
  margin: 14px 0;
}

/* 分割线：偏灰紫、弱光，不纯白 */
.divider {
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(180, 185, 220, 0.35),
    rgba(160, 165, 210, 0.25),
    transparent
  );
  margin: 16px 0;
  border: none;
}

.footer-text {
  position: relative;
  z-index: 1;
  margin: 36px 0 40px 40px;
  font-size: 13px;
  color: #888a9f;
  opacity: 0;
  animation: fadeFooter 1s ease-out 7.5s forwards;
}

@keyframes fadeFooter {
  to {
    opacity: 

/* ========== 新增 iOS 风格玻璃通知弹窗 ========== */
.ios-notify{
  position: fixed;
  top: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(-90px);
  width: min(360px, calc(100% - 32px));
  z-index: 99999;

  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 18px;
  padding:14px 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);

  transition: 0.4s cubic-bezier(0.2,0,0.2,1);
  opacity:0.2;
}
.ios-notify.show{
  transform: translateX(-50%) translateY(0);
  opacity:1;
}
.notify-title{
  font-size:14px;
  color:#ffffff;
  font-weight:500;
  margin-bottom:4px;
}
.notify-body{
  font-size:13px;
  color:#e6e8f5;
  line-height:1.5;
}
</style>
</head>

<body>


<img class="avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80" alt="头像" />

<div class="profile-card">
  <div class="realtime" id="realtime"></div>

  <h1 class="name">宿弦</h1>
  <p class="subtitle">little universe, together</p>

  <p class="info-line line-1">记录时间：2026-10-12 22:10:55</p>
  <p class="info-line line-2">配文：孤独因你而千变万化</p>

  <div class="tag-wrap">
    <span class="tag">土象金牛座</span>
    <span class="tag">INTP T</span>
    <span class="tag">十八岁</span>
  </div>

  <p class="info-line alias-line">别名：宿弦</p>
</div>

<div class="small-card">
  <hr class="divider" />
  <p class="small-item">板评</p>
  <p class="small-item">话术</p>
  <p class="small-item">过往</p>
  <p class="small-item">须知</p>
</div>

<p class="footer-text">Welcome to my little universe</p>

<!-- iOS通知弹窗 -->
<div class="ios-notify" id="notify">
  <div class="notify-title">LITTLE UNIVERSE</div>
  <div class="notify-body">你最近过得怎么样？</div>
</div>

<script>
  function updateTime() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const seconds = String(now.getSeconds()).padStart(2, "0");

    const timeString = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    document.getElementById("realtime").textContent = timeString;
  }

  updateTime();
  setInterval(updateTime, 1000);

  // 页面加载后弹出 iOS 通知
  const notifyDom = document.getElementById('notify');
  window.addEventListener('load', ()=>{
    setTimeout(()=>{
      notifyDom.classList.add('show');
    }, 400);
  })
  // 点击通知可以关闭
  notifyDom.onclick = function(){
    notifyDom.classList.remove('show');
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>LITTLE UNIVERSE</title>

<script>
  // 非首次进入（含从子页面返回）时，标记为跳过所有入场动画
  if (sessionStorage.getItem("universe_visited")) {
    document.documentElement.classList.add("skip-anim");
  } else {
    sessionStorage.setItem("universe_visited", "1");
  }
</script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #e8e8e6;
  position: relative;
  overflow-x: hidden;

  background-image: url("images/bg.jpg");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  transition: background-image 0.6s ease-in-out;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, rgba(12, 14, 26, 0.46), rgba(30, 32, 52, 0.38));
  backdrop-filter: blur(1px);
  -webkit-backdrop-filter: blur(1px);
  z-index: 0;
  pointer-events: none;
}

@keyframes pageSlideIn {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.profile-card {
  position: relative;
  z-index: 1;
  margin: 70px 0 0 40px;
  max-width: 420px;
  background: rgba(255, 255, 255, 0.10);
  backdrop-filter: blur(24px) saturate(1.7);
  -webkit-backdrop-filter: blur(24px) saturate(1.7);
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 28px;
  padding: 22px;
  box-shadow:
    0 12px 44px rgba(0, 0, 0, 0.24),
    inset 0 1px 0 rgba(255, 255, 255, 0.45),
    inset 0 -1px 0 rgba(255, 255, 255, 0.08);
  animation: pageSlideIn 0.9s ease-out;
}

.avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255, 255, 255, 0.25);
  box-shadow: 0 0 18px rgba(255, 255, 255, 0.18);
  position: absolute;
  top: -36px;
  left: 22px;
  z-index: 3;
  transition: all 0.4s ease;
}

.card-top {
  display: flex;
  align-items: flex-start;
  margin-top: -13px;
  padding-left: 112px;
  margin-bottom: 8px;
}

/* 头像右侧两行小字：IP 在上、天气在下（无气泡） */
.top-lines {
  display: flex;
  flex-direction: column;
  gap: 3px;
  line-height: 1.1;
  margin-top: -4px;
}

/* 小号玻璃胶囊：FR 行 / 天气行 */
.tl-ip,
.tl-weather {
  display: flex;
  align-items: center;
  gap: 5px;
  align-self: flex-start;
  padding: 1.5px 8px;
  font-size: 10px;
  letter-spacing: 0.5px;
  color: #cfcfcd;
  background: rgba(255, 255, 255, 0.10);
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 999px;
  white-space: nowrap;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
}

.tl-ip {
  font-size: 11.5px;
  color: #c5c5c3;
  white-space: nowrap;
}

/* IP / FR 前缀：等宽字体 + 固定宽度，两行前缀与冒号严格上下对齐 */
.mono-tag {
  display: inline-block;
  width: 1.5em;
  font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace;
  font-size: 10px;
  letter-spacing: 0;
  vertical-align: baseline;
}

.tl-weather {
  font-size: 11.5px;
  letter-spacing: 0.5px;
  color: #c5c5c3;
  white-space: nowrap;
}

.name-title {
  font-size: 24px;
  letter-spacing: 2px;
  color: #ffffff;
  text-shadow: 0 0 14px rgba(255, 255, 255, 0.35);
  margin-top: 4px;
}

/* 微调「弦」字位置，修正字形重心偏高的视觉差 */
.char-fix {
  display: inline-block;
  transform: translateY(0.5px);
}

.sub-title {
  font-size: 14px;
  color: #c2c2c0;
  margin-bottom: 14px;
}

.info-lines {
  display: inline-grid;
  grid-template-columns: auto 1fr;
  column-gap: 8px;
  row-gap: 8px;
  align-items: baseline;
  margin: 4px 0;
}

.info-label {
  font-size: 13.5px;
  color: #c0c0be;
  text-align: right;
  white-space: nowrap;
}

.info-value {
  font-size: 13.5px;
  color: #e6e6e4;
  overflow: hidden;
  white-space: nowrap;
  width: fit-content;
  border-right: 2px solid rgba(230, 230, 230, 0.4);
}

.realtime {
  font-size: 13px;
  color: #b8b8b6;
  letter-spacing: 1px;
  text-shadow: 0 0 6px rgba(240, 240, 240, 0.18);
  white-space: nowrap;
}

.line-1 {
  color: #ffffff;
  text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
}

/* 留言：直接显示 */
.line-2 {
  border-right: none;
}

@keyframes type {
  to {
    width: 100%;
  }
}

@keyframes blink {
  0%, 100% {
    border-color: rgba(230, 230, 230, 0.4);
  }
  50% {
    border-color: transparent;
  }
}

.small-card {
  position: relative;
  z-index: 1;
  margin: 30px 0 0 40px;
  max-width: 378px;
  background: rgba(255, 255, 255, 0.09);
  backdrop-filter: blur(22px) saturate(1.6);
  -webkit-backdrop-filter: blur(22px) saturate(1.6);
  border: 1px solid rgba(255, 255, 255, 0.30);
  border-radius: 24px;
  padding: 16px 18px;
  box-shadow:
    0 8px 30px rgba(0, 0, 0, 0.16),
    inset 0 1px 0 rgba(255, 255, 255, 0.40),
    inset 0 -1px 0 rgba(255, 255, 255, 0.06);
  opacity: 0;
  transform: translateY(12px);
  animation: slideSmall 0.7s ease-out 0.9s forwards;
}

@keyframes slideSmall {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.small-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.small-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 16px;
  font-size: 14.5px;
  color: #e0e0de;
  text-decoration: none;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.20);
  border-radius: 16px;
  transition: all 0.24s ease;
}

.small-item .en {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: rgba(200, 200, 200, 0.55);
  margin-left: 10px;
  transition: all 0.24s ease;
}

.small-item::after {
  content: "→";
  margin-left: auto;
  font-size: 13px;
  color: rgba(200, 200, 200, 0.5);
  transition: all 0.24s ease;
}

.small-item:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.16);
  border-color: rgba(255, 255, 255, 0.40);
  text-shadow: 0 0 6px rgba(240, 240, 240, 0.3);
  transform: translateX(2px);
}

.small-item:hover::after {
  color: #fff;
  transform: translateX(2px);
}

.footer-text {
  position: relative;
  z-index: 1;
  margin: 40px 0 40px 40px;
  max-width: 420px;
  text-align: center;
  font-size: 12.5px;
  color: rgba(200, 200, 200, 0.35);
  opacity: 0;
  animation: fadeFooter 0.7s ease-out 1.7s forwards;
}

.footer-text::before {
  content: "· · ·";
  display: block;
  letter-spacing: 6px;
  margin-bottom: 8px;
  color: rgba(200, 200, 200, 0.35);
}

@keyframes fadeFooter {
  to {
    opacity: 1;
  }
}

.ios-notify {
  position: fixed;
  top: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(-90px);
  width: min(360px, calc(100% - 32px));
  z-index: 99999;
  background: rgba(255, 255, 255, 0.16);
  backdrop-filter: blur(28px) saturate(1.8);
  -webkit-backdrop-filter: blur(28px) saturate(1.8);
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 22px;
  padding: 14px 18px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.45);
  transition: 0.4s cubic-bezier(0.2,0,0.2,1);
  opacity: 0.2;
}

.ios-notify.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

.notify-title {
  font-size: 14px;
  color: #ffffff;
  font-weight: 500;
  margin-bottom: 4px;
}

.notify-body {
  font-size: 13px;
  color: #c2c2c0;
  line-height: 1.5;
}

/* ===== 天气特效层（背景之上、卡片之下） ===== */
#weatherFx {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}

.profile-card, .small-card, .footer-text { z-index: 2; }

/* 雨：细长雨丝 */
.rain-drop {
  position: absolute;
  top: -8vh;
  width: 1.5px;
  height: 60px;
  background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.35));
  border-radius: 2px;
  animation: rainFall linear infinite;
}

@keyframes rainFall {
  to { transform: translateY(115vh); }
}

/* 雪：白色圆点雪花，飘落加摇摆 */
.snow-flake {
  position: absolute;
  top: -3vh;
  border-radius: 50%;
  background: rgba(255,255,255,0.85);
  box-shadow: 0 0 6px rgba(255,255,255,0.6);
  animation: snowFall linear infinite, snowSway ease-in-out infinite alternate;
}

@keyframes snowFall {
  to { transform: translateY(112vh); }
}

@keyframes snowSway {
  from { margin-left: -14px; }
  to   { margin-left: 14px; }
}

/* 雾：横向漂移的雾带 */
.fog-band {
  position: absolute;
  left: -30vw;
  width: 160vw;
  height: 90px;
  background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.10) 30%, rgba(255,255,255,0.16) 50%, rgba(255,255,255,0.10) 70%, rgba(255,255,255,0) 100%);
  filter: blur(6px);
  border-radius: 50%;
  animation: fogDrift linear infinite;
}

@keyframes fogDrift {
  from { transform: translateX(-15vw); }
  to   { transform: translateX(15vw); }
}

/* 晴：右上角淡阳光光晕 + 漂浮光尘 */
.sun-glow {
  position: absolute;
  top: -90px;
  right: -60px;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,253,245,0.25) 0%, rgba(255,252,240,0.12) 40%, rgba(255,252,240,0) 70%);
  animation: sunPulse 6s ease-in-out infinite alternate;
}

@keyframes sunPulse {
  from { opacity: 0.6; transform: scale(1); }
  to   { opacity: 0.95; transform: scale(1.12); }
}

.sun-mote {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,252,240,0.45);
  box-shadow: 0 0 4px rgba(255,252,240,0.5);
  animation: moteFloat ease-in-out infinite alternate;
}

@keyframes moteFloat {
  from { transform: translateY(0) translateX(0); opacity: 0.25; }
  to   { transform: translateY(-26px) translateX(10px); opacity: 0.6; }
}

@media (prefers-reduced-motion: reduce) {
  .rain-drop, .snow-flake, .fog-band, .sun-mote { display: none; }
}

/* 非首次进入：跳过所有入场动画，直接呈现最终状态 */
.skip-anim .profile-card,
.skip-anim .small-card,
.skip-anim .footer-text,
.skip-anim .line-1,
.skip-anim .line-2,
.skip-anim .realtime,
.skip-anim .info-value {
  animation: none !important;
  opacity: 1 !important;
  transform: none !important;
}

@media (max-width: 768px) {
  .profile-card,
  .small-card,
  .footer-text {
    margin-left: 20px;
    margin-right: 20px;
  }

  .card-top {
    padding-left: 88px;
  }
}
</style>
</head>

<body>

<!-- 天气特效层：根据哈尔滨实时天气自动切换 -->
<div id="weatherFx" aria-hidden="true"></div>

<div class="ios-notify" id="notify">
  <div class="notify-title">LITTLE UNIVERSE</div>
  <div class="notify-body">你最近过得还好吗？</div>
</div>

<div class="profile-card">


  <img class="avatar" id="avatarImg" src="images/avatar.jpg" alt="头像">

  <div class="card-top">
    <div class="top-lines">
      <span class="tl-ip"><span class="mono-tag">FR</span>：雾山影</span>
      <span class="tl-weather"><span class="mono-tag">IP</span>：<span id="wCityShort">哈尔滨</span> <span id="wText">…</span></span>
    </div>
  </div>

  <h1 class="name-title">宿<span class="char-fix">弦</span></h1>
  <p class="sub-title">little universe, together</p>

  <div class="info-lines">
    <span class="info-label">实时时间：</span>
    <span class="info-value line-1"><span id="clock">2026-10-13 19:09:31</span></span>
    <span class="info-label">留言：</span>
    <span class="info-value line-2">孤独因你自己而千变万化</span>
  </div>
</div>

<div class="small-card">
  <div class="small-grid">
    <a class="small-item" href="notice.html"><span class="cn">须知</span><span class="en">Notice</span></a>
    <a class="small-item" href="script.html"><span class="cn">话术</span><span class="en">Script</span></a>
    <a class="small-item" href="history.html"><span class="cn">过往</span><span class="en">History</span></a>
    <a class="small-item" href="board.html"><span class="cn">板评</span><span class="en">Board</span></a>
  </div>
</div>

<p class="footer-text">Welcome to my little universe</p>

<script>
  function updateClock() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    const h = String(now.getHours()).padStart(2, "0");
    const mi = String(now.getMinutes()).padStart(2, "0");
    const s = String(now.getSeconds()).padStart(2, "0");
    document.getElementById("clock").innerText = `${y}-${m}-${d} ${h}:${mi}:${s}`;
  }

  updateClock();
  setInterval(updateClock, 1000);

  const notify = document.getElementById("notify");

  window.addEventListener("load", () => {
    if (sessionStorage.getItem("universe_notified")) {
      return;
    }
    sessionStorage.setItem("universe_notified", "1");

    setTimeout(() => {
      notify.classList.add("show");
    }, 400);

    setTimeout(() => {
      notify.classList.remove("show");
    }, 2500);
  });

  // 哈尔滨实时天气（Open-Meteo 免费接口，无需密钥）
  (function loadWeather() {
    const codes = {
      0: ["☀️", "晴"], 1: ["🌤️", "基本晴"], 2: ["⛅", "多云"], 3: ["☁️", "阴"],
      45: ["🌫️", "雾"], 48: ["🌫️", "雾凇"],
      51: ["🌦️", "毛毛雨"], 53: ["🌦️", "毛毛雨"], 55: ["🌦️", "毛毛雨"],
      56: ["🌧️", "冻毛毛雨"], 57: ["🌧️", "冻毛毛雨"],
      61: ["🌧️", "小雨"], 63: ["🌧️", "中雨"], 65: ["🌧️", "大雨"],
      66: ["🌧️", "冻雨"], 67: ["🌧️", "冻雨"],
      71: ["🌨️", "小雪"], 73: ["🌨️", "中雪"], 75: ["❄️", "大雪"], 77: ["❄️", "米雪"],
      80: ["🌦️", "阵雨"], 81: ["🌦️", "阵雨"], 82: ["⛈️", "强阵雨"],
      85: ["🌨️", "阵雪"], 86: ["🌨️", "阵雪"],
      95: ["⛈️", "雷雨"], 96: ["⛈️", "雷雨冰雹"], 99: ["⛈️", "雷雨冰雹"]
    };
    const url = "https://api.open-meteo.com/v1/forecast?latitude=45.75&longitude=126.65&current=temperature_2m,weather_code&timezone=Asia%2FShanghai";
    function tryFetch(retry) {
      fetch(url)
        .then(r => r.json())
        .then(data => {
          const t = Math.round(data.current.temperature_2m);
          const code = data.current.weather_code;
          const [icon, name] = codes[code] || ["", "未知"];
          document.getElementById("wText").innerText = `${name} · ${t}°C`;
          startWeatherFx(code);
        })
        .catch(() => {
          if (retry > 0) {
            setTimeout(() => tryFetch(retry - 1), 3000);
          } else {
            document.getElementById("wText").innerText = "天气暂不可用";
          }
        });
    }
    tryFetch(2);

    // 天气特效：晴(0-1)光晕光尘 / 阴(2-3)无 / 雾(45,48)雾带 / 雨(51-67,80-82,95-99)雨丝 / 雪(71-77,85,86)雪花
    function startWeatherFx(code) {
      const fx = document.getElementById("weatherFx");
      fx.innerHTML = "";
      const rnd = (a, b) => a + Math.random() * (b - a);

      if (code <= 1) {                       // 晴
        const glow = document.createElement("div");
        glow.className = "sun-glow";
        fx.appendChild(glow);
        for (let i = 0; i < 14; i++) {
          const m = document.createElement("div");
          m.className = "sun-mote";
          const s = rnd(2, 4.5);
          m.style.width = m.style.height = s + "px";
          m.style.left = rnd(5, 95) + "vw";
          m.style.top = rnd(10, 90) + "vh";
          m.style.animationDuration = rnd(4, 9) + "s";
          m.style.animationDelay = rnd(0, 5) + "s";
          fx.appendChild(m);
        }
      } else if (code === 45 || code === 48) { // 雾
        for (let i = 0; i < 4; i++) {
          const f = document.createElement("div");
          f.className = "fog-band";
          f.style.top = rnd(15, 85) + "vh";
          f.style.animationDuration = rnd(14, 26) + "s";
          f.style.animationDelay = rnd(0, 6) + "s";
          f.style.opacity = rnd(0.6, 1);
          fx.appendChild(f);
        }
      } else if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95) { // 雨
        for (let i = 0; i < 46; i++) {
          const d = document.createElement("div");
          d.className = "rain-drop";
          d.style.left = rnd(0, 100) + "vw";
          d.style.animationDuration = rnd(0.7, 1.3) + "s";
          d.style.animationDelay = rnd(0, 2) + "s";
          d.style.opacity = rnd(0.4, 0.9);
          fx.appendChild(d);
        }
      } else if ((code >= 71 && code <= 77) || code === 85 || code === 86) { // 雪
        for (let i = 0; i < 34; i++) {
          const s = document.createElement("div");
          s.className = "snow-flake";
          const size = rnd(2.5, 5.5);
          s.style.width = s.style.height = size + "px";
          s.style.left = rnd(0, 100) + "vw";
          s.style.animationDuration = rnd(6, 12) + "s, " + rnd(2, 4) + "s";
          s.style.animationDelay = rnd(0, 8) + "s, 0s";
          s.style.opacity = rnd(0.5, 0.95);
          fx.appendChild(s);
        }
      }
      // 阴天（2-3）不加特效，保持干净
    }
    window.startWeatherFx = startWeatherFx;
  })();
</script>

</body>
</html>
